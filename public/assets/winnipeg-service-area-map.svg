<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Styles & Animations -->
    <style><![CDATA[
@keyframes pulseCenter {
        0% { transform: scale(0.85); opacity: 0.7; }
        50% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(0.85); opacity: 0.7; }
      }
      
      @keyframes radiateAnim {
        0% { transform: scale(0.1); opacity: 0.8; stroke-width: 3px; }
        100% { transform: scale(1); opacity: 0; stroke-width: 0.5px; }
      }

      @keyframes dashFlow {
        from { stroke-dashoffset: 24; }
        to { stroke-dashoffset: 0; }
      }

      @keyframes floatNode {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }

      .center-pulse {
        transform-origin: 400px 300px;
        animation: pulseCenter 3s ease-in-out infinite;
      }

      .radiate-ring {
        transform-origin: 400px 300px;
        animation: radiateAnim 6s cubic-bezier(0.25, 0.8, 0.5, 1) infinite;
      }
      
      .delay-1 { animation-delay: 2s; }
      .delay-2 { animation-delay: 4s; }

      .flow-line {
        stroke-dasharray: 4 8;
        animation: dashFlow 1.5s linear infinite;
      }

      .floating {
        animation: floatNode 4s ease-in-out infinite;
      }
      .floating.alt {
        animation-delay: 2s;
      }
]]></style>

    <!-- Gradients -->
    <radialGradient id="serviceAreaGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3BA0D6" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#3BA0D6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#3BA0D6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignetteGrad" cx="50%" cy="50%" r="75%">
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </radialGradient>

    <!-- Filters -->
    <filter id="orangeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="blueGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Patterns -->
    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#3BA0D6" opacity="0.15"/>
    </pattern>

    <!-- Motion Paths -->
    <path id="pathA" d="M 400,300 L 490,210" fill="none"/>
    <path id="pathB" d="M 400,300 L 280,390" fill="none"/>
    <path id="pathC" d="M 620,120 L 490,210" fill="none"/>
    <path id="pathD" d="M 180,500 L 280,390" fill="none"/>
    <path id="pathE" d="M 400,300 L 530,320" fill="none"/>
    <path id="pathF" d="M 310,190 L 400,300" fill="none"/>
  </defs>

  <!-- 1. Background -->
  <rect width="100%" height="100%" fill="#FFFFFF"/>
  <rect width="100%" height="100%" fill="url(#dotGrid)"/>

  <!-- 2. Abstract Geometric Geography (Faceted Regions) -->
  <g stroke="#3BA0D6" stroke-width="1" stroke-linejoin="round">
    <!-- North/East Region -->
    <path d="M 400,300 L 620,120 L 750,200 L 700,280 L 530,320 Z" fill="#3BA0D6" fill-opacity="0.03" stroke-opacity="0.15"/>
    <!-- South/East Region -->
    <path d="M 400,300 L 530,320 L 700,280 L 600,480 L 410,550 L 390,440 Z" fill="#3BA0D6" fill-opacity="0.05" stroke-opacity="0.1"/>
    <!-- South/West Region -->
    <path d="M 400,300 L 390,440 L 410,550 L 180,500 L 100,310 L 260,280 Z" fill="#3BA0D6" fill-opacity="0.02" stroke-opacity="0.15"/>
    <!-- North/West Region -->
    <path d="M 400,300 L 260,280 L 100,310 L 150,120 L 420,60 L 380,160 Z" fill="#3BA0D6" fill-opacity="0.04" stroke-opacity="0.1"/>
  </g>

  <!-- Abstract Topographic River Lines -->
  <g fill="none" stroke="#3BA0D6" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main River (Red River equivalent) -->
    <path d="M 430,600 L 410,500 L 420,400 L 400,300 L 380,200 L 390,100 L 360,0" stroke-width="12" opacity="0.06"/>
    <path d="M 430,600 L 410,500 L 420,400 L 400,300 L 380,200 L 390,100 L 360,0" stroke-width="2" opacity="0.15"/>
    <!-- Secondary River (Assiniboine equivalent) -->
    <path d="M 0,340 L 120,320 L 220,350 L 320,310 L 400,300" stroke-width="10" opacity="0.06"/>
    <path d="M 0,340 L 120,320 L 220,350 L 320,310 L 400,300" stroke-width="2" opacity="0.15"/>
  </g>

  <!-- 3. Service Area (100km Soft Radiating Circle) -->
  <g>
    <!-- Static Soft Fill -->
    <circle cx="400" cy="300" r="180" fill="url(#serviceAreaGrad)"/>
    <!-- Static Dashed Boundary -->
    <circle cx="400" cy="300" r="180" fill="none" stroke="#3BA0D6" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4"/>
    <!-- Inner Decorative Rings -->
    <circle cx="400" cy="300" r="60" fill="none" stroke="#3BA0D6" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.3"/>
    <circle cx="400" cy="300" r="120" fill="none" stroke="#3BA0D6" stroke-width="0.5" stroke-dasharray="2 4" opacity="0.2"/>
    
    <!-- Animated Radiating Rings -->
    <circle cx="400" cy="300" r="280" fill="none" stroke="#3BA0D6" class="radiate-ring"/>
    <circle cx="400" cy="300" r="280" fill="none" stroke="#3BA0D6" class="radiate-ring delay-1"/>
    <circle cx="400" cy="300" r="280" fill="none" stroke="#3BA0D6" class="radiate-ring delay-2"/>
  </g>

  <!-- 4. Network Connections (Lines) -->
  <g stroke="#3BA0D6" stroke-linecap="round" opacity="0.35">
    <!-- Center to Inner Ring -->
    <line x1="400" y1="300" x2="380" y2="160" stroke-width="1.5"/>
    <line x1="400" y1="300" x2="490" y2="210" stroke-width="2" stroke="#E8620C" opacity="0.6"/>
    <line x1="400" y1="300" x2="530" y2="320" stroke-width="1.5"/>
    <line x1="400" y1="300" x2="460" y2="420" stroke-width="1"/>
    <line x1="400" y1="300" x2="390" y2="440" stroke-width="1.5"/>
    <line x1="400" y1="300" x2="280" y2="390" stroke-width="2" stroke="#E8620C" opacity="0.6"/>
    <line x1="400" y1="300" x2="260" y2="280" stroke-width="1"/>
    <line x1="400" y1="300" x2="310" y2="190" stroke-width="1.5"/>

    <!-- Inner Ring Interconnections -->
    <line x1="380" y1="160" x2="490" y2="210" stroke-width="0.5"/>
    <line x1="490" y1="210" x2="530" y2="320" stroke-width="0.5"/>
    <line x1="530" y1="320" x2="460" y2="420" stroke-width="0.5"/>
    <line x1="460" y1="420" x2="390" y2="440" stroke-width="0.5"/>
    <line x1="390" y1="440" x2="280" y2="390" stroke-width="0.5"/>
    <line x1="280" y1="390" x2="260" y2="280" stroke-width="0.5"/>
    <line x1="260" y1="280" x2="310" y2="190" stroke-width="0.5"/>
    <line x1="310" y1="190" x2="380" y2="160" stroke-width="0.5"/>

    <!-- Inner to Outer Ring -->
    <line x1="380" y1="160" x2="420" y2="60" stroke-width="1"/>
    <line x1="490" y1="210" x2="620" y2="120" stroke-width="1.5" stroke="#E8620C" opacity="0.5"/>
    <line x1="530" y1="320" x2="700" y2="280" stroke-width="1"/>
    <line x1="460" y1="420" x2="600" y2="480" stroke-width="1"/>
    <line x1="390" y1="440" x2="410" y2="550" stroke-width="1"/>
    <line x1="280" y1="390" x2="180" y2="500" stroke-width="1.5" stroke="#E8620C" opacity="0.5"/>
    <line x1="260" y1="280" x2="100" y2="310" stroke-width="1"/>
    <line x1="310" y1="190" x2="150" y2="120" stroke-width="1"/>
  </g>

  <!-- Animated Data Flow Lines -->
  <g stroke="#E8620C" stroke-width="1.5" fill="none" opacity="0.7">
    <line x1="400" y1="300" x2="490" y2="210" class="flow-line"/>
    <line x1="400" y1="300" x2="280" y2="390" class="flow-line"/>
  </g>

  <!-- Data Particles (SMIL Animation) -->
  <g fill="#E8620C" filter="url(#orangeGlow)">
    <circle r="2.5">
      <animateMotion dur="3s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#pathA"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5">
      <animateMotion dur="4s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#pathB"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle r="2">
      <animateMotion dur="3.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#pathC"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="3.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2">
      <animateMotion dur="4.5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#pathD"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="4.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g fill="#3BA0D6" filter="url(#blueGlow)">
    <circle r="2">
      <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#pathE"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2">
      <animateMotion dur="3.8s" repeatCount="indefinite" keyPoints="0;1" keyTimes="0;1" calcMode="linear">
        <mpath href="#pathF"/>
      </animateMotion>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.2;0.8;1" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- 5. Town Nodes -->
  <g stroke="#3BA0D6" fill="#FFFFFF">
    <!-- Outer Ring Towns (Smaller) -->
    <g stroke-width="1.5" opacity="0.7">
      <circle cx="420" cy="60" r="3"/>
      <circle cx="620" cy="120" r="4" stroke="#E8620C" stroke-width="2" opacity="1"/>
      <circle cx="700" cy="280" r="3"/>
      <circle cx="600" cy="480" r="3"/>
      <circle cx="410" cy="550" r="3"/>
      <circle cx="180" cy="500" r="4" stroke="#E8620C" stroke-width="2" opacity="1"/>
      <circle cx="100" cy="310" r="3"/>
      <circle cx="150" cy="120" r="3"/>
    </g>

    <!-- Inner Ring Towns (Medium) -->
    <g stroke-width="2">
      <circle cx="380" cy="160" r="4.5" class="floating"/>
      <circle cx="490" cy="210" r="5.5" stroke="#E8620C" class="floating alt"/>
      <circle cx="530" cy="320" r="4.5" class="floating"/>
      <circle cx="460" cy="420" r="4.5" class="floating alt"/>
      <circle cx="390" cy="440" r="4.5" class="floating"/>
      <circle cx="280" cy="390" r="5.5" stroke="#E8620C" class="floating alt"/>
      <circle cx="260" cy="280" r="4.5" class="floating"/>
      <circle cx="310" cy="190" r="4.5" class="floating alt"/>
    </g>
  </g>

  <!-- 6. Center Node (Winnipeg) -->
  <g class="center-pulse">
    <!-- Outer Glow Ring -->
    <circle cx="400" cy="300" r="22" fill="#E8620C" opacity="0.15"/>
    <circle cx="400" cy="300" r="14" fill="#E8620C" opacity="0.3"/>
    <!-- Main Prominent Dot -->
    <circle cx="400" cy="300" r="8" fill="#E8620C" filter="url(#orangeGlow)"/>
    <!-- Inner Core -->
    <circle cx="400" cy="300" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Center Crosshairs (Map Accent) -->
  <g stroke="#E8620C" stroke-width="1" opacity="0.6">
    <line x1="385" y1="300" x2="392" y2="300"/>
    <line x1="408" y1="300" x2="415" y2="300"/>
    <line x1="400" y1="285" x2="400" y2="292"/>
    <line x1="400" y1="308" x2="400" y2="315"/>
  </g>

  <!-- 7. Map Accents & Decorations -->
  <!-- Top Left Compass Accent -->
  <g transform="translate(50, 50)" stroke="#3BA0D6" opacity="0.4">
    <circle cx="0" cy="0" r="18" fill="none" stroke-width="1"/>
    <circle cx="0" cy="0" r="14" fill="none" stroke-width="0.5" stroke-dasharray="2 2"/>
    <circle cx="0" cy="0" r="2" fill="#E8620C" stroke="none" opacity="0.8"/>
    <line x1="0" y1="-24" x2="0" y2="-12" stroke-width="1.5"/>
    <line x1="0" y1="12" x2="0" y2="24" stroke-width="1"/>
    <line x1="-24" y1="0" x2="-12" y2="0" stroke-width="1"/>
    <line x1="12" y1="0" x2="24" y2="0" stroke-width="1"/>
  </g>

  <!-- Bottom Right Scale Bar -->
  <g transform="translate(680, 540)" stroke="#3BA0D6" opacity="0.5">
    <line x1="0" y1="0" x2="60" y2="0" stroke-width="2"/>
    <line x1="0" y1="-4" x2="0" y2="4" stroke-width="1.5"/>
    <line x1="15" y1="-2" x2="15" y2="2" stroke-width="1"/>
    <line x1="30" y1="-3" x2="30" y2="3" stroke-width="1"/>
    <line x1="45" y1="-2" x2="45" y2="2" stroke-width="1"/>
    <line x1="60" y1="-4" x2="60" y2="4" stroke-width="1.5"/>
  </g>

  <!-- 8. Vignette Overlay (Focuses attention on center) -->
  <rect width="100%" height="100%" fill="url(#vignetteGrad)" pointer-events="none"/>
</svg>